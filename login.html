<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — AJWEARS</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-page"><main class="auth-card"><a href="/" class="auth-logo"><img src="/static/assets/01_AJWEARS_logo_exact.png" alt="AJWEARS"></a><span class="micro-label">CLIENT ACCESS</span><h1>Welcome back.</h1><p>Sign in to manage your orders, wishlist and account.</p><form id="loginForm"><input name="email" type="email" placeholder="Email address" required><input name="password" type="password" placeholder="Password" required><button class="btn btn-dark full">SIGN IN</button></form><div class="auth-links"><a href="/register">Create an account</a><a href="/">Continue shopping</a></div><div class="form-message" id="msg"></div></main><script>const CSRF={{ csrf|tojson }};document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)return document.querySelector('#msg').textContent=d.error;location.href='/account'});</script></body></html>
