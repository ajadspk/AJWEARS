<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AJWEARS Admin</title><link rel="stylesheet" href="/static/style.css"></head><body class="admin-page"><header class="admin-top"><a href="/" class="brand"><img src="/static/assets/01_AJWEARS_logo_exact.png" alt="AJWEARS"></a><div><span>ADMIN</span><button id="logout">Logout</button></div></header><main class="admin-layout"><aside class="admin-nav"><button data-view="dashboard">Dashboard</button><button data-view="products">Products</button><button data-view="orders">Orders</button><button data-view="customers">Customers</button><button data-view="settings">Site Settings</button></aside><section class="admin-main" id="adminMain"></section></main><script>const CSRF={{ csrf|tojson }};const main=document.querySelector('#adminMain');async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-CSRF-Token':CSRF};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function money(v){return `PKR ${Number(v).toLocaleString('en-PK')}`}async function view(v='dashboard'){document.querySelectorAll('.admin-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='dashboard'){const d=await api('/api/admin/summary');main.innerHTML=`<div class="admin-title"><span class="micro-label">AJWEARS CONTROL</span><h1>Dashboard</h1></div><div class="dashboard-cards"><div><span>Sales</span><b>${money(d.sales)}</b></div><div><span>Orders</span><b>${d.orders}</b></div><div><span>Customers</span><b>${d.customers}</b></div><div><span>Products</span><b>${d.products}</b></div><div><span>Low stock</span><b>${d.low_stock}</b></div><div><span>Pending</span><b>${d.pending}</b></div></div>`}if(v==='products'){const ps=await api('/api/admin/products');main.innerHTML=`<div class="admin-title"><span class="micro-label">CATALOG</span><h1>Products <button class="btn btn-dark" onclick="newProduct()">+ ADD PRODUCT</button></h1></div><div class="admin-table"><div class="thead"><span>Product</span><span>Price</span><span>Stock</span><span>Status</span><span>Action</span></div>${ps.map(p=>`<div class="tr"><span><img src="${p.image}">${p.name}</span><span>${money(p.sale_price??p.price)}</span><span>${p.stock}</span><span>${p.active?'Published':'Archived'}</span><span><button onclick="editProduct(${p.id})">Edit</button> <button onclick="archiveProduct(${p.id})">Archive</button></span></div>`).join('')}</div>`}if(v==='orders'){const os=await api('/api/admin/orders');main.innerHTML=`<div class="admin-title"><span class="micro-label">FULFILMENT</span><h1>Orders</h1></div><div class="admin-table"><div class="thead"><span>Order</span><span>Customer</span><span>Total</span><span>Status</span><span>Action</span></div>${os.map(o=>`<div class="tr"><span>#${o.id}</span><span>${o.customer_name}<small>${o.email}</small></span><span>${money(o.total)}</span><span>${o.status}</span><span><select onchange="status(${o.id},this.value)">${['Order Placed','Confirmed','Processing','Packed','Shipped','Out for Delivery','Delivered','Cancelled','Returned','Refunded'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></span></div>`).join('')}</div>`}if(v==='customers'){const cs=await api('/api/admin/customers');main.innerHTML=`<div class="admin-title"><span class="micro-label">CLIENTS</span><h1>Customers</h1></div><div class="admin-table"><div class="thead"><span>Customer</span><span>Email</span><span>Orders</span><span>Spent</span><span>Status</span></div>${cs.map(c=>`<div class="tr"><span>${c.name}</span><span>${c.email}</span><span>${c.orders}</span><span>${money(c.spent)}</span><span><button onclick="toggleCustomer(${c.id},${c.active?0:1})">${c.active?'Deactivate':'Activate'}</button></span></div>`).join('')}</div>`}if(v==='settings'){const s=await api('/api/admin/settings');main.innerHTML=`<div class="admin-title"><span class="micro-label">EDITABLE BRAND</span><h1>Site settings</h1></div><div class="panel"><form id="settingsForm" class="form-grid"><label>Announcement<input name="announcement" value="${s.announcement||''}"></label><label>Contact email<input name="contact_email" value="${s.contact_email||''}"></label><label>Phone<input name="phone" value="${s.phone||''}"></label><label>Instagram<input name="instagram" value="${s.instagram||''}"></label><label>TikTok<input name="tiktok" value="${s.tiktok||''}"></label><label>YouTube<input name="youtube" value="${s.youtube||''}"></label><button class="btn btn-dark">SAVE SETTINGS</button></form></div>`;document.querySelector('#settingsForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert('Saved')}}}function productForm(p={}){return `<div class="modal" id="editModal"><div class="modal-card"><button onclick="closeModal()">×</button><h2>${p.id?'Edit':'New'} product</h2><form id="productForm" class="form-grid"><input name="name" value="${p.name||''}" placeholder="Name" required><input name="category" value="${p.category||'Men'}" placeholder="Category" required><input name="collection" value="${p.collection||'New Arrivals'}" placeholder="Collection" required><input name="price" type="number" value="${p.price||0}" placeholder="Price" required><input name="sale_price" type="number" value="${p.sale_price??''}" placeholder="Sale price"><input name="stock" type="number" value="${p.stock||0}" placeholder="Stock"><input name="sku" value="${p.sku||''}" placeholder="SKU"><input name="image" value="${p.image||'/static/assets/07_New_arrivals_exact.png'}" placeholder="Image path" required><input name="colors" value="${(p.colors||[]).join(',')||''}" placeholder="Colors: Black,Stone"><input name="sizes" value="${(p.sizes||['S','M','L','XL']).join(',')}" placeholder="Sizes: S,M,L,XL"><textarea name="description" placeholder="Description" required>${p.description||''}</textarea><textarea name="material" placeholder="Material">${p.material||''}</textarea><textarea name="care" placeholder="Care">${p.care||''}</textarea><label><input type="checkbox" name="featured" ${p.featured!==false?'checked':''}> Featured</label><label><input type="checkbox" name="active" ${p.active!==false?'checked':''}> Published</label><button class="btn btn-dark">SAVE PRODUCT</button></form></div></div>`}function newProduct(){document.body.insertAdjacentHTML('beforeend',productForm());bindProductForm()}async function editProduct(id){const p=await api('/api/products/'+id);document.body.insertAdjacentHTML('beforeend',productForm(p));bindProductForm(id)}function bindProductForm(id){document.querySelector('#productForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),d=Object.fromEntries(fd);d.featured=fd.has('featured');d.active=fd.has('active');d.price=Number(d.price);d.stock=Number(d.stock);if(d.sale_price)d.sale_price=Number(d.sale_price);await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(d)});closeModal();view('products')}}function closeModal(){document.querySelector('#editModal')?.remove()}async function archiveProduct(id){if(confirm('Archive this product?')){await api('/api/admin/products/'+id,{method:'DELETE'});view('products')}}async function status(id,v){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:v})})}async function toggleCustomer(id,a){await api('/api/admin/customers/'+id,{method:'PATCH',body:JSON.stringify({active:a})});view('customers')}document.querySelectorAll('.admin-nav button').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelector('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/'};view();</script></body></html>
