<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — AJWEARS</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="simple-header"><a href="/" class="brand"><img src="/static/assets/01_AJWEARS_logo_exact.png" alt="AJWEARS"></a><a href="/">Back to store →</a></header><main class="account-layout"><aside class="account-nav"><span class="micro-label">MY ACCOUNT</span><h1 id="hello">Hello.</h1><button data-tab="overview">Overview</button><button data-tab="orders">Orders</button><button data-tab="wishlist">Wishlist</button><button data-tab="addresses">Addresses</button><button data-tab="profile">Profile</button><button id="logoutBtn">Logout</button></aside><section class="account-content" id="accountContent"></section></main><script>const CSRF={{ csrf|tojson }};const content=document.querySelector('#accountContent');let user={{ user|tojson }};function money(v){return `PKR ${Number(v).toLocaleString('en-PK')}`}async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-CSRF-Token':CSRF};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function show(tab='overview'){document.querySelectorAll('.account-nav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelector('#hello').textContent=`Hello, ${user.name.split(' ')[0]}.`;if(tab==='overview'){const orders=await api('/api/account/orders');content.innerHTML=`<div class="account-title"><span class="micro-label">OVERVIEW</span><h2>Your AJWEARS space.</h2></div><div class="stat-grid"><div><b>${orders.length}</b><span>Orders</span></div><div><b>♡</b><span>Wishlist</span></div><div><b>${user.email}</b><span>Email</span></div></div><div class="panel"><h3>Recent orders</h3>${orders.slice(0,3).map(o=>`<div class="order-row"><b>#${o.id}</b><span>${o.status}</span><strong>${money(o.total)}</strong></div>`).join('')||'<p class="muted">No orders yet. Explore the latest collection.</p>'}</div>`}if(tab==='orders'){const orders=await api('/api/account/orders');content.innerHTML=`<div class="account-title"><span class="micro-label">ORDER HISTORY</span><h2>Your orders.</h2></div><div class="panel">${orders.map(o=>`<article class="order-card"><div class="order-row"><b>#${o.id}</b><span>${o.status}</span><strong>${money(o.total)}</strong></div><p>${new Date(o.created_at).toLocaleDateString()} · ${o.payment}</p><div class="order-items">${o.items.map(i=>`<span>${i.product_name} × ${i.quantity} · ${i.size}</span>`).join('')}</div></article>`).join('')||'<p class="muted">No orders yet.</p>'}</div>`}if(tab==='wishlist'){let items=[];try{items=await api('/api/wishlist')}catch{}content.innerHTML=`<div class="account-title"><span class="micro-label">SAVED PIECES</span><h2>Your wishlist.</h2></div><div class="account-products">${items.map(p=>`<article><img src="${p.image}"><h3>${p.name}</h3><p>${money(p.sale_price??p.price)}</p><button class="btn btn-dark" onclick="add(${p.id})">ADD TO BAG</button></article>`).join('')||'<p class="muted">Your wishlist is empty.</p>'}</div>`}if(tab==='addresses'){const a=await api('/api/account/addresses');content.innerHTML=`<div class="account-title"><span class="micro-label">DELIVERY</span><h2>Your addresses.</h2></div><div class="address-grid">${a.map(x=>`<div class="panel"><b>${x.full_name}</b><p>${x.address}<br>${x.city}, ${x.province||''} ${x.postal_code||''}<br>${x.phone}</p><button class="text-btn" onclick="delAddress(${x.id})">Remove</button></div>`).join('')}</div><div class="panel"><h3>Add address</h3><form id="addressForm" class="form-grid"><input name="full_name" placeholder="Full name" required><input name="phone" placeholder="Phone" required><input name="city" placeholder="City" required><input name="province" placeholder="Province"><input name="postal_code" placeholder="Postal code"><input name="country" value="Pakistan"><textarea name="address" placeholder="Complete address" required></textarea><label><input type="checkbox" name="is_default"> Default address</label><button class="btn btn-dark">SAVE ADDRESS</button></form></div>`;document.querySelector('#addressForm').onsubmit=async e=>{e.preventDefault();await api('/api/account/addresses',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});show('addresses')}}if(tab==='profile'){content.innerHTML=`<div class="account-title"><span class="micro-label">ACCOUNT</span><h2>Your profile.</h2></div><div class="panel"><form id="profileForm" class="form-grid"><input name="name" value="${user.name}" required><input name="phone" value="${user.phone||''}" placeholder="Phone"><input value="${user.email}" disabled><button class="btn btn-dark">SAVE CHANGES</button></form></div>`;document.querySelector('#profileForm').onsubmit=async e=>{e.preventDefault();const d=await api('/api/account/profile',{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});user=d.user;show('profile')}}}async function add(id){await api('/api/cart/items',{method:'POST',body:JSON.stringify({product_id:id,quantity:1,size:'M'})});alert('Added to bag.')}async function delAddress(id){await api('/api/account/addresses/'+id,{method:'DELETE'});show('addresses')}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));document.querySelector('#logoutBtn').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/'};show();</script></body></html>
