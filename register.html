<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — AJWEARS</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-page"><main class="auth-card"><a href="/" class="auth-logo"><img src="/static/assets/01_AJWEARS_logo_exact.png" alt="AJWEARS"></a><span class="micro-label">NEW CLIENT</span><h1>Create your account.</h1><p>Save your wishlist, manage orders and keep your AJWEARS wardrobe together.</p><form id="registerForm"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email address" required><input name="phone" placeholder="Phone number"><input name="password" type="password" placeholder="Password — 8+ characters" minlength="8" required><button class="btn btn-dark full">CREATE ACCOUNT</button></form><div class="auth-links"><a href="/login">Already have an account?</a><a href="/">Continue shopping</a></div><div class="form-message" id="msg"></div></main><script>const CSRF={{ csrf|tojson }};document.querySelector('#registerForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)return document.querySelector('#msg').textContent=d.error;location.href='/account'});</script></body></html>
